apiVersion: apps/v1
kind: Deployment
metadata:
  name: skua-api
  namespace: skua
  labels:
    app.kubernetes.io/name: skua-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skua-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skua-api
    spec:
      serviceAccountName: skua-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: skua:dev
          imagePullPolicy: IfNotPresent
          args: [api]
          env:
            - name: SKUA_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: skua-config
                  key: config.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: skua-api
  namespace: skua
  labels:
    app.kubernetes.io/name: skua-api
spec:
  selector:
    app.kubernetes.io/name: skua-api
  ports:
    - name: http
      port: 80
      targetPort: http
