apiVersion: v1
kind: ServiceAccount
metadata:
  name: skua-operator
  namespace: skua
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skua-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skua-operator
subjects:
  - kind: ServiceAccount
    name: skua-operator
    namespace: skua
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-operator
  namespace: skua
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-operator
subjects:
  - kind: ServiceAccount
    name: skua-operator
    namespace: skua
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-operator
  namespace: skua-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-operator
subjects:
  - kind: ServiceAccount
    name: skua-operator
    namespace: skua
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skua-operator
  namespace: skua
  labels:
    app.kubernetes.io/name: skua-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skua-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skua-operator
    spec:
      serviceAccountName: skua-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: skua:dev
          imagePullPolicy: IfNotPresent
          args: [operator]
          env:
            - name: SKUA_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: skua-config
                  key: config.yaml
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
