---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skua-operator
rules:
- apiGroups:
  - apiextensions.k8s.io
  resourceNames:
  - sandboxclaims.extensions.agents.x-k8s.io
  - sandboxes.agents.x-k8s.io
  - sandboxtemplates.extensions.agents.x-k8s.io
  - sandboxwarmpools.extensions.agents.x-k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
- apiGroups:
  - skua.dev
  resources:
  - agentprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - skua.dev
  resources:
  - agentprofiles/finalizers
  verbs:
  - update
- apiGroups:
  - skua.dev
  resources:
  - agentprofiles/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-operator
  namespace: agent-sandbox-system
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-operator
  namespace: skua
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - skua.dev
  resources:
  - agentruns
  verbs:
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - skua.dev
  resources:
  - agentruns/finalizers
  verbs:
  - update
- apiGroups:
  - skua.dev
  resources:
  - agentruns/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-operator
  namespace: skua-sandboxes
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxclaims
  - sandboxtemplates
  - sandboxwarmpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
