---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skua-api
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - skua.dev
  resources:
  - agentprofiles
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-api
  namespace: skua
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - skua.dev
  resources:
  - agentruns
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - skua.dev
  resources:
  - agentruns/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-api
  namespace: skua-sandboxes
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxclaims
  verbs:
  - get
