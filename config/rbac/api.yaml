apiVersion: v1
kind: ServiceAccount
metadata:
  name: skua-api
  namespace: skua
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skua-api:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: skua-api
    namespace: skua
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skua-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skua-api
subjects:
  - kind: ServiceAccount
    name: skua-api
    namespace: skua
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-api
  namespace: skua
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-api
subjects:
  - kind: ServiceAccount
    name: skua-api
    namespace: skua
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-api
  namespace: skua-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-api
subjects:
  - kind: ServiceAccount
    name: skua-api
    namespace: skua
