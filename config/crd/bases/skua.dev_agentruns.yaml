              reason never change once the phase is terminal.
            properties:
              claim:
                description: Claim is the name of the run's SandboxClaim.
                type: string
              conditions:
                description: Conditions holds additional run conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                description: FinishedAt is when the run turned terminal.
                format: date-time
                type: string
              message:
                description: Message carries detail on the reason.
                type: string
              outputs:
                description: Outputs are the forge objects the run produced.
                properties:
                  branch:
                    description: Branch is the pushed branch.
                    type: string
                  pullRequest:
                    description: PullRequest is the number of the opened pull request.
                    format: int64
                    type: integer
                type: object
              phase:
                description: Phase is Pending, Running, Succeeded or Failed.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              podName:
                description: PodName is the sandbox pod bound to the claim.
                type: string
              podUID:
                description: PodUID is the uid of that pod.
                type: string
              profileSnapshot:
                description: ProfileSnapshot is the profile spec the run was admitted
                  with.
                properties:
                  adapter:
                    default: omp-rpc
                    description: Adapter is the protocol skua-runner uses to drive
                      the agent.
                    enum:
                    - omp-rpc
                    type: string
                  command:
                    description: Command starts the agent inside the container; skua-runner
                      runs it as its child.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  description:
                    description: Description is shown to developers when they list
                      profiles.
                    maxLength: 1024
                    type: string
                  forge:
                    default: none
                    description: Forge is the code host whose tokens a run receives;
                      none gives the run no forge credentials.
                    enum:
                    - github
                    - none
                    type: string
                  image:
                    description: Image is the agent container image, pinned by digest.
                    minLength: 1
                    type: string
                  limits:
                    default: {}
                    description: Limits bound every run of this profile.
                    properties:
                      budgetUSD:
                        anyOf:
                        - type: integer
                        - type: string
                        default: "10"
                        description: BudgetUSD is the gateway spend limit of one run,
                          in US dollars.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      maxRestarts:
                        default: 3
                        description: MaxRestarts is how often skua-runner restarts
                          a crashed agent before the run fails.
                        format: int32
                        minimum: 0
                        type: integer
                      maxResultBytes:
                        default: 262144
                        description: MaxResultBytes is the largest result a run may
                          return.
                        format: int64
                        maximum: 1048576
                        minimum: 1024
                        type: integer
                      maxRuntime:
                        default: 4h
                        description: MaxRuntime is the longest a run may stay non-terminal,
                          as a Go duration.
                        type: string
                    type: object
                  models:
                    description: Models are the gateway model names a run may use.
                    items:
                      maxLength: 128
                      type: string
                    maxItems: 8
                    minItems: 1
                    type: array
                  resources:
                    description: Resources are the agent container's requests and
