                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  runtimeClassName:
                    description: RuntimeClassName overrides the installer's default
                      runtime class for sandbox pods.
                    type: string
                  warmPool:
                    default: {}
                    description: WarmPool keeps idle sandboxes ready for new runs.
                    properties:
                      replicas:
                        default: 1
                        description: Replicas is the number of idle sandboxes kept
                          ready.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  workspace:
                    default: {}
                    description: Workspace is the volume mounted at /work.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 10Gi
                        description: Size is the workspace capacity.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: StorageClassName, when set, backs the workspace
                          with a generic ephemeral volume of this class instead of
                          an emptyDir.
                        type: string
                    type: object
                required:
                - command
                - image
                - models
                type: object
              reason:
                description: Reason is set when the phase turns terminal.
                type: string
              result:
                description: Result is the agent's final text as a string, or the
                  JSON value it submitted.
                x-kubernetes-preserve-unknown-fields: true
              startedAt:
                description: StartedAt is when the run turned Running.
                format: date-time
                type: string
            type: object
            x-kubernetes-validations:
            - message: phase and reason are immutable once the phase is terminal
              rule: '!has(oldSelf.phase) || !(oldSelf.phase in [''Succeeded'', ''Failed''])
