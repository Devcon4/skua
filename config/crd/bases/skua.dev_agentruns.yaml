---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agentruns.skua.dev
spec:
  group: skua.dev
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    shortNames:
    - ar
    singular: agentrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentRun is one task executed by an agent in a sandbox.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentRunSpec is the task a developer asked for. It is immutable.
            properties:
              clientKey:
                description: ClientKey is chosen by the client so a retried create
                  returns the existing run.
                maxLength: 256
                minLength: 1
                type: string
              profile:
                description: Profile names the AgentProfile the run uses.
                minLength: 1
                type: string
              task:
                description: Task is the prompt and the optional result schema.
                properties:
                  prompt:
                    description: Prompt is the instruction sent to the agent.
                    minLength: 1
                    type: string
                  schema:
                    description: Schema is a JSON Schema the result must satisfy;
                      when set the agent returns its result through submit_result.
                    x-kubernetes-preserve-unknown-fields: true
                required:
                - prompt
                type: object
              workspace:
                description: Workspace is the repository cloned into /work; omitted
                  for runs without a repository.
                properties:
                  baseRef:
                    description: BaseRef is the branch, tag or commit the workspace
                      is checked out at.
                    maxLength: 255
                    minLength: 1
                    type: string
                  repo:
                    description: Repo is the repository as owner/name.
                    pattern: ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$
                    type: string
                required:
                - baseRef
                - repo
                type: object
            required:
            - clientKey
            - profile
            - task
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
