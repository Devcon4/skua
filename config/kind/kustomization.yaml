apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
  - api-nodeport.yaml
  - app-secret-role.yaml
  - generic-profile.yaml
configMapGenerator:
  - name: skua-config
    namespace: skua
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
