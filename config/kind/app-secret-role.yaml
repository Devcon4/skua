apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-operator-app-secret
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [skua-test-github-app]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-operator-app-secret
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-operator-app-secret
subjects:
  - kind: ServiceAccount
    name: skua-operator
    namespace: skua
