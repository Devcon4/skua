operator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

api:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  host: skua.example.com
  tls:
    secretName: skua-api-tls

config:
  oidc:
    issuerURL: https://login.example.com/realms/engineering
    audience: skua-omp
  gateway:
    baseURL: http://litellm.litellm.svc:4000
    operatorKeySecret:
      namespace: skua-system
      name: skua-litellm-operator
      key: apiKey
    egress:
      namespace: litellm
      podLabels:
        app.kubernetes.io/name: litellm
      port: 4000
  github:
    appSecret:
      namespace: flux-system
      name: skua-github-app
  network:
    podCIDRs: [10.244.0.0/16]
    serviceCIDRs: [10.96.0.0/12]
    nodeCIDRs: [192.168.10.0/24]
  defaults:
    runtimeClassName: gvisor
  retention:
    afterFetch: 24h
    max: 168h
