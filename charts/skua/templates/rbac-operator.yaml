apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skua-operator
  labels:
    {{- include "skua.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - sandboxes.agents.x-k8s.io
      - sandboxtemplates.extensions.agents.x-k8s.io
      - sandboxwarmpools.extensions.agents.x-k8s.io
      - sandboxclaims.extensions.agents.x-k8s.io
    verbs: ["get"]
  - apiGroups: ["skua.dev"]
    resources: ["agentprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["skua.dev"]
    resources: ["agentprofiles/finalizers"]
    verbs: ["update"]
  - apiGroups: ["skua.dev"]
    resources: ["agentprofiles/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skua-operator
  labels:
    {{- include "skua.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skua-operator
subjects:
  {{- include "skua.operatorSubject" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-operator
  namespace: {{ include "skua.runNamespace" . }}
  labels:
    {{- include "skua.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["skua.dev"]
    resources: ["agentruns"]
    verbs: ["delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["skua.dev"]
    resources: ["agentruns/finalizers"]
    verbs: ["update"]
  - apiGroups: ["skua.dev"]
    resources: ["agentruns/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-operator
  namespace: {{ include "skua.runNamespace" . }}
  labels:
    {{- include "skua.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-operator
subjects:
  {{- include "skua.operatorSubject" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-operator
  namespace: {{ include "skua.sandboxNamespace" . }}
  labels:
    {{- include "skua.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxtemplates", "sandboxwarmpools"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-operator
  namespace: {{ include "skua.sandboxNamespace" . }}
  labels:
    {{- include "skua.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-operator
subjects:
  {{- include "skua.operatorSubject" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-operator
  namespace: {{ include "skua.agentSandboxNamespace" . }}
  labels:
    {{- include "skua.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-operator
  namespace: {{ include "skua.agentSandboxNamespace" . }}
  labels:
    {{- include "skua.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-operator
subjects:
  {{- include "skua.operatorSubject" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-operator-litellm-key
  namespace: {{ include "skua.operatorKeyNamespace" . }}
  labels:
    {{- include "skua.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.config.gateway.operatorKeySecret.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-operator-litellm-key
  namespace: {{ include "skua.operatorKeyNamespace" . }}
  labels:
    {{- include "skua.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-operator-litellm-key
subjects:
  {{- include "skua.operatorSubject" . | nindent 2 }}
{{- with .Values.config.github }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skua-github-app-secret
  namespace: {{ .appSecret.namespace }}
  labels:
    {{- include "skua.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .appSecret.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skua-github-app-secret
  namespace: {{ .appSecret.namespace }}
  labels:
    {{- include "skua.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skua-github-app-secret
subjects:
  {{- include "skua.operatorSubject" $ | nindent 2 }}
{{- end }}
