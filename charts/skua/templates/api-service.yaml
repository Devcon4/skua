apiVersion: v1
kind: Service
metadata:
  name: skua-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: skua-api
    {{- include "skua.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: skua-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      {{- if and .Values.api.service.nodePort (ne .Values.api.service.type "ClusterIP") }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
