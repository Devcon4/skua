apiVersion: v1
kind: ServiceAccount
metadata:
  name: skua-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: skua-operator
    {{- include "skua.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skua-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: skua-api
    {{- include "skua.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skua-runner
  namespace: {{ include "skua.sandboxNamespace" . }}
  labels:
    app.kubernetes.io/name: skua-runner
    {{- include "skua.labels" . | nindent 4 }}
automountServiceAccountToken: false
