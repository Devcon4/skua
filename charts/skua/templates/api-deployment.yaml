apiVersion: apps/v1
kind: Deployment
metadata:
  name: skua-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: skua-api
    {{- include "skua.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skua-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skua-api
        {{- include "skua.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "skua.config" . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: skua-api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "skua.podSecurityContext" . | nindent 8 }}
      containers:
        - name: skua
          image: {{ include "skua.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          env:
            - name: SKUA_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: skua-config
                  key: config.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          securityContext:
            {{- include "skua.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
