apiVersion: v1
kind: Namespace
metadata:
  name: sse-echo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sse-echo
  namespace: sse-echo
  labels:
    app.kubernetes.io/name: sse-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sse-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sse-echo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sse-echo
          image: python:3.15.2-alpine@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
          command:
            - python3
            - -u
            - -B
            - -c
            - |
              import http.server
              import itertools
              import time


              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          body = b"ok\n"
                          self.send_response(200)
                          self.send_header("Content-Type", "text/plain")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                          return
                      self.send_response(200)
                      self.send_header("Content-Type", "text/event-stream")
                      self.send_header("Cache-Control", "no-cache")
                      self.end_headers()
                      try:
                          for n in itertools.count(1):
                              time.sleep(15)
                              self.wfile.write(b": hb\n\n")
                              if n % 4 == 0:
                                  tick = n // 4
                                  self.wfile.write(f"id: {tick}\nevent: tick\ndata: {tick}\n\n".encode())
                              self.wfile.flush()
                      except (BrokenPipeError, ConnectionResetError):
                          pass


              http.server.ThreadingHTTPServer(("", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sse-echo
  namespace: sse-echo
  labels:
    app.kubernetes.io/name: sse-echo
spec:
  selector:
    app.kubernetes.io/name: sse-echo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sse-echo
  namespace: sse-echo
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sse.127.0.0.1.nip.io
      secretName: sse-tls
  rules:
    - host: sse.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sse-echo
                port:
                  name: http
