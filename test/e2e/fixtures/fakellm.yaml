apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakellm
  namespace: gateway
  labels:
    app: fakellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fakellm
  template:
    metadata:
      labels:
        app: fakellm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fakellm
          image: skua-e2e-fakellm:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fakellm
  namespace: gateway
  labels:
    app: fakellm
spec:
  selector:
    app: fakellm
  ports:
    - name: http
      port: 8080
      targetPort: http
