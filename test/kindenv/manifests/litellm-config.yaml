model_list:
  - model_name: e2e-primary
    litellm_params:
      model: openai/fake-primary
      api_base: http://fakellm.gateway.svc:8080/v1
      api_key: fake
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00002
  - model_name: e2e-helper
    litellm_params:
      model: openai/fake-helper
      api_base: http://fakellm.gateway.svc:8080/v1
      api_key: fake
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
  - model_name: e2e-other
    litellm_params:
      model: openai/fake-other
      api_base: http://fakellm.gateway.svc:8080/v1
      api_key: fake
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00002
  - model_name: e2e-claude
    litellm_params:
      model: anthropic/claude-fake
      api_base: http://fakellm.gateway.svc:8080
      api_key: fake
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  user_api_key_cache_ttl: 10

litellm_settings:
  upperbound_key_generate_params:
    max_budget: 25
    duration: 1d
